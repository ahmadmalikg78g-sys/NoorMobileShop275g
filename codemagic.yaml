
workflows:
  android-build:
    name: Noor Mobile Shop Android
    max_build_duration: 120
    instance_type: linux_x2
    scripts:
      - name: Set Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build APK
        script: gradle assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
      
